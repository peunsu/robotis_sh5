seed: 42


models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: False  # action space is unbounded; skrl 2.0.0 errors on clip_actions=True
                         # with None space limits (1.4.3 silently no-op'd). Matches sh5.
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 0.75
    initial_log_std: -1.514  # ln(0.22) ≈ -1.514 → σ=0.22 as in MassDexMimic paper
    network:
      - name: net
        input: OBSERVATIONS
        layers: [1024, 1024, 512, 512]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [1024, 1024, 512, 512]
        activations: elu
    output: ONE


memory:
  class: RandomMemory
  memory_size: -1


agent:
  class: PPO
  rollouts: 8
  learning_epochs: 5
  mini_batches: 8
  discount_factor: 0.96
  lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.016
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.004
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.1
  time_limit_bootstrap: False
  experiment:
    directory: "robotis_shadow_grasp_pretrain"
    experiment_name: "default"
    write_interval: 100
    checkpoint_interval: 1000
    wandb: False


trainer:
  class: SequentialTrainer
  timesteps: 5000   # synced with MARL pretrain (was 3000)
  environment_info: log
