seed: 42


# Kinematic-only pretrain for the G1+Shadow loco-manip policy. Same model shapes as the train
# yaml (621 obs / 65 act) so pretrain.pt transfers by shape; shorter horizon (no physics object).
models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 0.75
    initial_log_std: -1.514  # σ≈0.22
    network:
      - name: net
        input: OBSERVATIONS
        layers: [1024, 1024, 512, 512]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [1024, 1024, 512, 512]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  rollouts: 8
  learning_epochs: 5
  mini_batches: 8
  discount_factor: 0.96
  gae_lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.016
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2                      # >0 enables predicted-value clipping (replaces clip_predicted_values)
  entropy_loss_scale: 0.004
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.1
  # See skrl_ppo_cfg.yaml — episodes end by sequence-end time-out (truncated slot); False would let
  # the next episode's value/advantage bleed across the boundary instead of bootstrapping.
  time_limit_bootstrap: True
  experiment:
    directory: "g1_shadow_sonic_residual_pretrain"
    experiment_name: "default"
    write_interval: 10
    checkpoint_interval: 2000
    wandb: False

trainer:
  class: SequentialTrainer
  timesteps: 30000   # kinematic pretrain — shorter than the train phase
  environment_info: log
