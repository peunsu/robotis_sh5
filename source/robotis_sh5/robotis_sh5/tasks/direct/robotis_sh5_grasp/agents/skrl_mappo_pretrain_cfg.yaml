seed: 42


# Pretrain MAPPO config — identical to train except experiment directory and
# training horizon. Network architecture is the same so the resulting ckpt can
# be passed directly to train_marl via --checkpoint.
models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 0.75
    initial_log_std: -1.5141
    network:
      - name: net
        input: OBSERVATIONS
        layers: [1024, 1024, 512, 512]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [1024, 1024, 512, 512]
        activations: elu
    output: ONE


memory:
  class: RandomMemory
  memory_size: -1


agent:
  class: MAPPO
  rollouts: 8
  learning_epochs: 5
  mini_batches: 8
  discount_factor: 0.96
  lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.016
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  shared_state_preprocessor: RunningStandardScaler
  shared_state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.004
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.1
  time_limit_bootstrap: False
  experiment:
    directory: "robotis_sh5_grasp_marl_pretrain"
    experiment_name: "default"
    write_interval: 100
    checkpoint_interval: 1000
    wandb: False


trainer:
  class: SequentialTrainer
  timesteps: 5000
  environment_info: log


# Project-specific overrides — see skrl_mappo_cfg.yaml for description.
# In pretrain log_std is later frozen for both agents, so this sets the value
# at which the arm policy's σ stays fixed throughout pretrain.
project_overrides:
  arm_initial_log_std: null   # no override → arm uses default σ=0.22 (same as SA / hand)
