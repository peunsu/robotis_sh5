seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: True
  policy:  # see gaussian_model parameters
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 0.75
    initial_log_std: -1.5141  # ln(0.22) ≈ -1.514 → σ=0.22 as in MassDexMimic paper
    mass_mu_init: -0.25        # MassDexMimic Section 3.2: initial mass mean
    mass_log_std_init: -1.25   # MassDexMimic Section 3.2: initial mass log-std
    network:
      - name: net
        input: OBSERVATIONS
        layers: [1024, 1024, 512, 512]
        activations: elu
    output: ACTIONS
  value:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [1024, 1024, 512, 512]
        activations: elu
    output: ONE


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO
  rollouts: 8           # horizon length (MassDexMimic: 8 steps)
  learning_epochs: 5    # mini_epochs (MassDexMimic: 5)
  mini_batches: 4
  discount_factor: 0.96  # gamma (MassDexMimic: 0.96)
  lambda: 0.95
  learning_rate: 3.0e-04  # MassDexMimic: 3e-4
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.016   # MassDexMimic KL threshold
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2       # clip epsilon (MassDexMimic: 0.2)
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.004
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  # logging and checkpoint
  experiment:
    directory: "robotis_sh5_grasp"
    experiment_name: "default"
    write_interval: 100
    checkpoint_interval: 1000
    wandb: False


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 20000   # synced with MARL train (was 10000)
  environment_info: log
